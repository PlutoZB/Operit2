name: Windows Build Fixed v3

on:
  workflow_dispatch:
    inputs:
      products:
        description: "要构建的产物"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "CLI 架构"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare build hook dependencies (venv + TypeScript)
        shell: pwsh
        run: |
          python -m venv .venv
          $py = ".venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) {
            throw "Failed to create venv at $py"
          }
          & $py -m pip install --upgrade pip
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          $tsc = ".ci-tools\typescript\node_modules\.bin\tsc.cmd"
          if (-not (Test-Path -LiteralPath $tsc)) {
            throw "TypeScript compiler not prepared at $tsc"
          }

      - name: Install built-in plugin dependencies
        working-directory: plugins/packages/buildin/workflow
        shell: pwsh
        run: |
          corepack enable pnpm
          corepack pnpm install --frozen-lockfile

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Verify build hook Python venv
        shell: pwsh
        run: |
          $py = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "hook venv missing: $py" }
          & $py -c "import sys; print('hook python OK:', sys.version)"

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      - name: Pre-warm Flutter pub cache (retry on gitee.com DNS failure)
        if: inputs.products != 'cli'
        working-directory: apps/flutter/app
        shell: pwsh
        env:
          PUB_CACHE: C:\Users\runneradmin/.pub-cache
        run: |
          # pubspec.lock 里有 4 个 ohos 插件依赖 gitee.com 上的 git 仓库
          # （path_provider_ohos / url_launcher_ohos / video_player_ohos 等）。
          # GitHub runner 解析 gitee.com 时好时坏（偶发 Could not resolve host），
          # 这里先反复预热 pub 缓存，成功后后续构建就不会再联网拉取。
          $flutter = "D:\a\Operit2\Operit2\apps\flutter\app\.fvm\flutter_sdk\bin\flutter.bat"
          for ($i = 1; $i -le 8; $i++) {
            Write-Host "===== flutter pub get 第 $i 次 ====="
            & $flutter pub get --enforce-lockfile 2>&1 | Out-String | Write-Host
            if ($LASTEXITCODE -eq 0) {
              Write-Host "pub 缓存预热成功（第 $i 次）"
              exit 0
            }
            Write-Host "失败，等待 20 秒后重试..."
            Start-Sleep -Seconds 20
          }
          throw "flutter pub get 连续 8 次失败：gitee.com 依赖无法拉取。请直接 Re-run 本 workflow 重试。"

      - name: Generate Dart proxy artifacts (cargo check on core proxy crate)
        if: inputs.products != 'cli'
        shell: pwsh
        run: |
          # apps/flutter/app/lib/core/proxy/generated/ 被 .gitignore 排除，
          # 必须由 cargo check 现场生成；Windows 脚本默认不生成，会导致
          # NetworkControlPanel.dart 找不到 RuntimeDeviceSpaceTopology 等类型。
          cargo check --manifest-path core/crates/proxy/local/Cargo.toml --quiet
          $gen = "apps/flutter/app/lib/core/proxy/generated"
          $need = @(
            "$gen/CoreProxyModels.g.dart",
            "$gen/CoreProxyClients.g.dart"
          )
          $missing = $need | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "Dart proxy 产物未生成: $($missing -join ', ')"
          }
          Write-Host "Dart proxy 产物已生成:"
          Get-ChildItem -LiteralPath $gen | ForEach-Object { Write-Host "   " $_.Name }

      - name: Build and package Windows app
        id: build_app
        if: inputs.products != 'cli'
        shell: pwsh
        run: |
          $log = "build-windows.log"
          python tools/build_scripts/build_flutter_windows.py --archive-path tools/release/dist/operit2-app-windows-x86_64.zip --enforce-lockfile *> $log
          $code = $LASTEXITCODE
          Write-Host "----- 构建日志末尾 300 行 -----"
          if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 300 }
          Write-Host "----- 结束 (exit=$code) -----"
          if ($code -ne 0) { exit $code }

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v7
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v7
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-win-run${{ github.run_number }}
          path: build-windows.log
          if-no-files-found: warn
          retention-days: 30
