name: Android Build Fixed v6 (Self-Signed)

on:
  workflow_dispatch:
    inputs:
      skip_runtime:
        description: '跳过 runtime 编译（复用上次产物，可省约20分钟）'
        type: boolean
        default: false
      runtime_run_id:
        description: '复用产物时填写：上次成功生成 runtime 的运行 ID（Actions 页面网址里那段数字）'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  build-android-runtime:
    if: ${{ !inputs.skip_runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Android runtime build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            build-essential \
            bzip2 \
            ca-certificates \
            curl \
            diffutils \
            flex \
            gawk \
            gzip \
            patch \
            pkg-config \
            tar \
            unzip \
            xz-utils

      - name: Fetch Android runtime sources
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: pwsh -NoProfile -File tools/android-runtime/fetch_sources.ps1

      - name: Fetch Android NDK
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Build Android terminal runtime
        run: |
          export ANDROID_NDK_HOME="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          bash tools/android-runtime/build_android_tools_wsl.sh
          bash tools/android-runtime/build_alpine_rootfs_wsl.sh

      - name: Upload Android terminal runtime
        uses: actions/upload-artifact@v7
        with:
          name: operit2-android-runtime
          overwrite: true
          path: |
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/libbash.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_busybox.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_loader.so
            apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin
            apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin.sha256
          if-no-files-found: error
          retention-days: 30

  build-android-v8:
    # V8 的 Chromium 构建脚本硬性断言 host_os == "linux"
    # （//build/config/BUILDCONFIG.gn:262 "Android builds are only supported on Linux."），
    # 因此 V8 源码构建不能放在 windows runner 上。这里在 Linux 上编好 V8，
    # 把缓存目录作为 artifact 交给 build-android，Windows 侧 cache_valid()
    # 命中后 build.rs 直接复用 RUSTY_V8_ARCHIVE，不再调用 gn。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      RUST_TOOLCHAIN_VERSION: 1.95.0

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Install V8 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bzip2 ca-certificates curl flex g++ git libc6-dev \
            libssl-dev ninja-build pkg-config python3 python3-pip \
            unzip xz-utils zlib1g-dev
          # depot_tools 未用：prepare_android_v8.py 通过 CIPD 自行拉取 pinned gn/ninja。
          # V8 的 bindings 生成需要 libclang 21.1+、链接需要 ld.lld
          # （BUILDING.md 第 6 条）。ubuntu-24.04 默认源没有 llvm-21，
          # 必须加 apt.llvm.org 源，否则报 "Unable to locate package llvm-21-dev"。
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev lld-21 libclang-21-dev libclang1-21
          # prepare_android_v8.py 的 find_libclang() 用正则 libclang\.so\.(\d+)
          # 需要 >= 21，而 Debian/Ubuntu 包的文件名是 libclang-21.so.21（带 -21），
          # 匹配不到，会抛 "require LLVM/libclang 21.1 or newer"。
          # 补一个上游命名的软链接让它可见；不修改上游脚本。
          sudo ln -sf /usr/lib/llvm-21/lib/libclang-21.so.21 /usr/lib/llvm-21/lib/libclang.so.21
          ls -l /usr/lib/llvm-21/lib/libclang*.so* || true
          ls -l /usr/lib/llvm-21/bin/ld.lld || true

      - name: Fetch Android NDK
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 25
          max_attempts: 5
          retry_wait_seconds: 30
          shell: bash
          command: bash tools/android-runtime/fetch_ndk_wsl.sh

      - name: Cache source-built Android V8
        uses: actions/cache@v5
        with:
          path: tools/release/work/android-v8
          key: linux-android-v8-${{ hashFiles('tools/build_scripts/prepare_android_v8.py', 'apps/flutter/native/operit-flutter-bridge/Cargo.lock') }}

      - name: Build Android V8 (aarch64)
        run: |
          # 显式固定 NDK，保证与 Windows 侧 manifest.configuration 里的
          # android_ndk_version 完全一致（由目录名 r29-beta4 推导为 r29b）。
          export OPERIT_ANDROID_V8_NDK="$HOME/.cache/operit-android-runtime/android-ndk-r29-beta4"
          # libclang / ld.lld 由 find_libclang()/find_lld() 自行在
          # /usr/lib/llvm21/lib 与 llvm*/bin/ld.lld 下探测（apt 装 llvm-21-dev + lld-21）。
          python3 tools/build_scripts/prepare_android_v8.py \
            --target aarch64-linux-android \
            --env-file tools/release/work/android-v8-env.sh
          echo "--- env file ---"
          cat tools/release/work/android-v8-env.sh
          echo "--- cache artifacts ---"
          find tools/release/work/android-v8 -type f \( -name 'librusty_v8.a' -o -name 'src_binding.rs' -o -name 'args.gn' -o -name 'manifest.json' \) | sed 's/^/  /'
          echo "--- manifest.json ---"
          cat tools/release/work/android-v8/*/aarch64-linux-android/manifest.json

      - name: Upload Android V8 cache
        uses: actions/upload-artifact@v7
        with:
          name: operit2-android-v8
          overwrite: true
          path: tools/release/work/android-v8
          if-no-files-found: error
          retention-days: 30

  build-android:
    # 必须等到 runtime 与 V8 两个产物 job 都成功；否则下载 artifact 会失败，
    # 白白浪费一次 30 分钟的 Windows 构建。
    needs: [build-android-runtime, build-android-v8]
    # needs 默认会把上游 job 的 skipped 当成失败向传播：当 skip_runtime=true 时
    # build-android-runtime 被跳过，build-android 就会整块被跳过、一个 APK 都不产。
    # 这里显式覆盖：runtime 允许 skipped（前提是给了 runtime_run_id），V8 必须 success。
    if: ${{ !cancelled() && needs.build-android-v8.result == 'success' && (needs.build-android-runtime.result == 'success' || (needs.build-android-runtime.result == 'skipped' && inputs.runtime_run_id != '')) }}
    runs-on: windows-2025
    timeout-minutes: 180
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      RUSTY_V8_MIRROR: https://github.com/satouriko/rusty-v8-mobile/releases/download

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Android terminal runtime (current run)
        if: ${{ inputs.runtime_run_id == '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main

      - name: Download Android terminal runtime (from run ${{ inputs.runtime_run_id }})
        if: ${{ inputs.runtime_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: operit2-android-runtime
          path: apps/flutter/app/android/app/src/main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runtime_run_id }}

      - name: Verify Android terminal runtime present
        shell: pwsh
        run: |
          $need = @(
            "apps/flutter/app/android/app/src/main/jniLibs/arm64-v8a/liboperit_proot.so",
            "apps/flutter/app/android/app/src/main/assets/android-runtime/arm64-v8a/rootfs.tar.gz.bin"
          )
          $missing = $need | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) {
            throw "Android runtime 产物缺失。请先跑一次 skip_runtime=false 生成产物，然后在此处填写那次运行的 ID 到 runtime_run_id: $($missing -join ', ')"
          }

      - name: Download Android V8 cache
        uses: actions/download-artifact@v8
        with:
          name: operit2-android-v8
          path: tools/release/work/android-v8

      - name: Verify Android V8 cache present
        shell: pwsh
        run: |
          # prepare_android_v8.py 的 cache_valid() 会校验 manifest.json 里的
          # configuration（含 android_ndk_version）与三个产物的 sha256；
          # 任一不符就会在 Windows 上重新走 gn，而 gn 在非 Linux 上必然失败。
          # 这里提前确认产物齐全，避免白跑一次 Gradle。
          $root = "tools/release/work/android-v8"
          $manifests = @(Get-ChildItem -LiteralPath $root -Recurse -Filter "manifest.json" -File -ErrorAction SilentlyContinue)
          if ($manifests.Count -ne 1) {
            throw "expected exactly one V8 manifest under $root, found $($manifests.Count)"
          }
          $dir = $manifests[0].Directory
          Write-Host "V8 cache dir: $($dir.FullName)"
          foreach ($name in @("librusty_v8.a", "src_binding.rs", "args.gn", "manifest.json")) {
            $p = Join-Path $dir.FullName $name
            if (-not (Test-Path -LiteralPath $p)) { throw "V8 cache artifact missing: $p" }
            Write-Host ("  {0,-16} {1,10} bytes" -f $name, (Get-Item -LiteralPath $p).Length)
          }
          $manifest = Get-Content -LiteralPath (Join-Path $dir.FullName "manifest.json") -Raw | ConvertFrom-Json
          Write-Host "  v8 version      : $($manifest.configuration.version)"
          Write-Host "  android_ndk_ver : $($manifest.configuration.gn.android_ndk_version)"

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: aarch64-linux-android

      - name: Prepare Android bindgen libclang
        shell: pwsh
        run: |
          $version = "21.1.8"
          $packageName = "libclang.runtime.win-x64.$version"
          $toolsDir = "target/operit-build-tools"
          $packageDir = Join-Path $toolsDir $packageName
          $archive = Join-Path $toolsDir "$packageName.nupkg"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/libclang.runtime.win-x64/$version" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $packageDir -Force
          $libclang = Join-Path $packageDir "runtimes/win-x64/native/libclang.dll"
          if (-not (Test-Path -LiteralPath $libclang)) {
            throw "Android bindgen libclang was not prepared at $libclang"
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare build hook dependencies (venv + TypeScript)
        shell: pwsh
        run: |
          python -m venv .venv
          $py = ".venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) {
            throw "Failed to create venv at $py"
          }
          & $py -m pip install --upgrade pip
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          $tsc = ".ci-tools\typescript\node_modules\.bin\tsc.cmd"
          if (-not (Test-Path -LiteralPath $tsc)) {
            throw "TypeScript compiler not prepared at $tsc"
          }

      - name: Install built-in plugin dependencies
        working-directory: plugins/packages/buildin/workflow
        shell: pwsh
        run: |
          corepack enable pnpm
          corepack pnpm install --frozen-lockfile

      - name: Verify build hook Python venv
        shell: pwsh
        run: |
          $py = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          if (-not (Test-Path -LiteralPath $py)) { throw "hook venv missing: $py" }
          & $py -c "import sys; print('hook python OK:', sys.version)"

      - name: Generate embedded plugin assets
        shell: pwsh
        run: |
          # 关键步骤：把 plugins/packages/{buildin,external} 下的 .js / .toolpkg 源
          # 同步（含 TypeScript 编译与 .toolpkg 打包）到
          # core/crates/runtime/application/assets/plugins/{buildin,external}。
          # 仓库不提交这些派生产物，缺失时 operit-runtime 的 build.rs 会
          #   panic: package example has no embedded archive
          # 导致 cargo check / build 直接失败。
          $ErrorActionPreference = "Stop"
          python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload
          if ($LASTEXITCODE -ne 0) { throw "sync_plugin_packages.py failed with exit code $LASTEXITCODE" }

          # 校验产物确实生成，避免静默回归
          $root = "core/crates/runtime/application/assets/plugins"
          foreach ($pair in @(
            @{ Dir = "$root/buildin";  Min = 10; Sample = "time.js" },
            @{ Dir = "$root/external"; Min = 10; Sample = "waifu.toolpkg" }
          )) {
            if (-not (Test-Path -LiteralPath $pair.Dir)) {
              throw "plugin asset dir missing: $($pair.Dir)"
            }
            $items = @(Get-ChildItem -LiteralPath $pair.Dir -File -ErrorAction SilentlyContinue |
                       Where-Object { $_.Extension -in @('.js', '.toolpkg') })
            Write-Host ("{0}: {1} 个资产" -f $pair.Dir, $items.Count)
            if ($items.Count -lt $pair.Min) {
              throw "plugin assets under $($pair.Dir) look incomplete ($($items.Count) < $($pair.Min))"
            }
            if (-not (Test-Path -LiteralPath (Join-Path $pair.Dir $pair.Sample))) {
              throw "expected sample asset missing: $($pair.Sample)"
            }
          }

      - name: Pre-install Android CMake 3.22.1 (multi-source,避开 dl.google.com)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $cmakeVersion = "3.22.1"

          # ---- 1. 定位 Android SDK ----
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk -or -not (Test-Path -LiteralPath $sdk)) {
            $sdk = "C:\Program Files (x86)\Android\android-sdk"
          }
          if (-not (Test-Path -LiteralPath $sdk)) { throw "Android SDK 未找到" }
          Write-Host "Android SDK: $sdk"

          $dest    = Join-Path $sdk "cmake\$cmakeVersion"
          $cmakeExe = Join-Path $dest "bin\cmake.exe"
          $ninjaExe = Join-Path $dest "bin\ninja.exe"
          $tmp = Join-Path $env:RUNNER_TEMP "cmake-preinstall"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          function OK { return (Test-Path -LiteralPath $cmakeExe) }

          if (OK) { Write-Host "CMake $cmakeVersion 已存在，跳过"; exit 0 }

          # ---- 2. 尝试 sdkmanager（最多 3 次，失败清残留）----
          $sdkmanager = $null
          foreach ($c in @(
            (Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"),
            (Join-Path $sdk "cmdline-tools\bin\sdkmanager.bat"),
            (Join-Path $sdk "tools\bin\sdkmanager.bat"))) {
            if (Test-Path -LiteralPath $c) { $sdkmanager = $c; break }
          }
          if (-not $sdkmanager) {
            $f = Get-ChildItem -Path $sdk -Filter "sdkmanager.bat" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($f) { $sdkmanager = $f.FullName }
          }
          if ($sdkmanager) {
            for ($i = 1; $i -le 3; $i++) {
              Write-Host "== sdkmanager 安装 cmake;$cmakeVersion （第 $i 次）=="
              & $sdkmanager --sdk_root="$sdk" --install "cmake;$cmakeVersion" 2>&1 | Out-String | Write-Host
              if (OK) { Write-Host "sdkmanager 安装成功"; break }
              if (Test-Path -LiteralPath $dest) { Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Seconds 8
            }
          } else { Write-Host "未找到 sdkmanager" }

          # ---- 3. 兜底 A：GitHub 上的 Kitware CMake 官方发布包（不走 dl.google.com）----
          if (-not (OK)) {
            $zip = Join-Path $tmp "cmake.zip"
            foreach ($url in @(
              "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-windows-x86_64.zip",
              "https://github.com/Kitware/CMake/releases/download/v$cmakeVersion/cmake-$cmakeVersion-win64-x64.zip"
            )) {
              for ($i = 1; $i -le 3; $i++) {
                Write-Host "== 下载 Kitware CMake: $url （第 $i 次）=="
                try {
                  if (Test-Path -LiteralPath $zip) { Remove-Item $zip -Force }
                  Invoke-WebRequest -Uri $url -OutFile $zip -TimeoutSec 600 -UseBasicParsing
                  $sz = (Get-Item $zip).Length
                  Write-Host "下载大小: $sz 字节"
                  if ($sz -lt 5MB) { throw "文件过小，疑似错误页面" }
                  $ex = Join-Path $tmp "cmake-ex"
                  if (Test-Path -LiteralPath $ex) { Remove-Item $ex -Recurse -Force }
                  Expand-Archive -LiteralPath $zip -DestinationPath $ex -Force
                  $hit = Get-ChildItem -Path $ex -Filter "cmake.exe" -Recurse -ErrorAction SilentlyContinue |
                         Where-Object { $_.FullName -like "*\bin\cmake.exe" } | Select-Object -First 1
                  if (-not $hit) { $hit = Get-ChildItem -Path $ex -Filter "cmake.exe" -Recurse | Select-Object -First 1 }
                  if ($hit) {
                    $root = Split-Path (Split-Path $hit.FullName) -Parent
                    Write-Host "解包根目录: $root"
                    New-Item -ItemType Directory -Force -Path (Split-Path $dest -Parent) | Out-Null
                    Copy-Item -LiteralPath $root -Destination $dest -Recurse -Force
                  }
                } catch { Write-Host "失败: $($_.Exception.Message)" }
                if (OK) { break }
                Start-Sleep -Seconds 8
              }
              if (OK) { break }
            }
          }

          # ---- 4. 兜底 B：choco 安装 ----
          if (-not (OK)) {
            Write-Host "== 兜底 choco 安装 cmake =="
            try {
              choco install cmake --version=$cmakeVersion --no-progress --limit-output --yes --force 2>&1 | Out-String | Write-Host
              $cand = @(
                "C:\Program Files\CMake\bin\cmake.exe",
                "C:\Program Files (x86)\CMake\bin\cmake.exe",
                "C:\ProgramData\chocolatey\lib\cmake\tools\cmake-$cmakeVersion-windows-x86_64\bin\cmake.exe"
              )
              foreach ($c in $cand) {
                if (Test-Path -LiteralPath $c) {
                  New-Item -ItemType Directory -Force -Path $dest | Out-Null
                  Copy-Item -LiteralPath (Split-Path $c -Parent) -Destination (Join-Path $dest "bin") -Recurse -Force
                  break
                }
              }
            } catch { Write-Host "choco 失败: $($_.Exception.Message)" }
          }

          # ---- 5. 补齐 ninja（Android cmake 包里自带，Kitware 包没有）----
          if (OK -and -not (Test-Path -LiteralPath $ninjaExe)) {
            Write-Host "== 补装 ninja =="
            $nz = Join-Path $tmp "ninja.zip"
            foreach ($nu in @(
              "https://github.com/ninja-build/ninja/releases/download/v1.11.1/ninja-win.zip",
              "https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-win.zip"
            )) {
              try {
                if (Test-Path -LiteralPath $nz) { Remove-Item $nz -Force }
                Invoke-WebRequest -Uri $nu -OutFile $nz -TimeoutSec 300 -UseBasicParsing
                $ne = Join-Path $tmp "ninja-ex"
                if (Test-Path -LiteralPath $ne) { Remove-Item $ne -Recurse -Force }
                Expand-Archive -LiteralPath $nz -DestinationPath $ne -Force
                $n = Get-ChildItem -Path $ne -Filter "ninja.exe" -Recurse | Select-Object -First 1
                if ($n) {
                  New-Item -ItemType Directory -Force -Path (Join-Path $dest "bin") | Out-Null
                  Copy-Item $n.FullName -Destination $ninjaExe -Force
                  Write-Host "ninja 就位"
                  break
                }
              } catch { Write-Host "ninja 下载失败: $($_.Exception.Message)" }
            }
          }

          # ---- 6. 校验 ----
          if (-not (OK)) { throw "CMake $cmakeVersion 安装失败（所有来源均不可用）" }
          & $cmakeExe --version
          if (Test-Path -LiteralPath $ninjaExe) { & $ninjaExe --version }

          # ---- 7. 写入 local.properties，双保险 ----
          $lp = "apps/flutter/app/android/local.properties"
          $lines = @()
          if (Test-Path -LiteralPath $lp) { $lines = Get-Content -LiteralPath $lp }
          $lines = $lines | Where-Object { $_ -notmatch '^\s*cmake\.dir\s*=' }
          $escaped = $dest.Replace('\', '\\').Replace(':', '\:')
          $lines += "cmake.dir=$escaped"
          Set-Content -LiteralPath $lp -Value $lines -Encoding utf8
          Write-Host "local.properties 已写入 cmake.dir=$escaped"

      - name: Install Android NDK (mirror of Linux r29-beta4, keeps V8 cache key stable)
        shell: pwsh
        run: |
          # prepare_android_v8.py 的 ndk_version() 从 NDK 目录名推导
          # android_ndk_version 并写入 manifest.json；cache_valid() 会逐字段比对。
          # build-android-v8 在 Linux 上用的是 android-ndk-r29-beta4（-> r29b），
          # 因此 Windows 侧必须放一个同名目录，否则缓存校验必然失败，
          # 并退回 gn（gn 在非 Linux 上直接断言 "Android builds are only supported on Linux."）。
          $ErrorActionPreference = "Stop"
          $cacheDir = Join-Path $env:RUNNER_TEMP "android-ndk"
          $ndkDir   = Join-Path $cacheDir "android-ndk-r29-beta4"
          $zip      = Join-Path $cacheDir "ndk.zip"
          New-Item -ItemType Directory -Force -Path $cacheDir | Out-Null

          if (-not (Test-Path -LiteralPath (Join-Path $ndkDir "toolchains"))) {
            Write-Host "Downloading Android NDK r29-beta4 (windows)..."
            Invoke-WebRequest -Uri "https://dl.google.com/android/repository/android-ndk-r29-beta4-windows.zip" -OutFile $zip -TimeoutSec 1800 -UseBasicParsing
            Write-Host "size: $((Get-Item $zip).Length) bytes"
            if (Test-Path -LiteralPath $ndkDir) { Remove-Item -LiteralPath $ndkDir -Recurse -Force }
            Expand-Archive -LiteralPath $zip -DestinationPath $cacheDir -Force
            Remove-Item -LiteralPath $zip -Force
          }

          if (-not (Test-Path -LiteralPath $ndkDir)) {
            throw "NDK extraction did not produce $ndkDir"
          }
          Write-Host "NDK ready: $ndkDir"
          # 供后续 V8 / Gradle 步骤使用（与 Linux manifest 的 r29b 对齐）
          "OPERIT_ANDROID_V8_NDK=$ndkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_NDK_HOME=$ndkDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Patch V8 NDK override in app/build.gradle.kts
        shell: pwsh
        run: |
          # 让 Gradle 传给 prepare_android_v8.py 的 NDK 可被环境变量覆盖，
          # 从而与 build-android-v8(manifest 里的 r29b) 完全一致；
          # 否则 cache_valid() 失败会退回 gn，而 gn 非 Linux 直接断言失败。
          $path = "apps/flutter/app/android/app/build.gradle.kts"
          if (-not (Test-Path -LiteralPath $path)) { throw "未找到 $path" }
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'environment("OPERIT_ANDROID_V8_NDK", android.ndkDirectory.absolutePath)'
          $new = 'environment("OPERIT_ANDROID_V8_NDK", System.getenv("OPERIT_ANDROID_V8_NDK") ?: android.ndkDirectory.absolutePath)'
          if ($text -like "*$old*") {
            $text = $text.Replace($old, $new)
            Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8
            Write-Host "已修补：OPERIT_ANDROID_V8_NDK 允许环境变量覆盖"
          } elseif ($text -like '*System.getenv("OPERIT_ANDROID_V8_NDK")*') {
            Write-Host "已包含修补，跳过"
          } else {
            throw "未匹配到 OPERIT_ANDROID_V8_NDK 赋值，上游代码可能已变动"
          }

      - name: Patch upstream Rust type error in AndroidJni.rs
        shell: pwsh
        run: |
          # 上游 main 里 apps/flutter/native/operit-flutter-bridge/src/AndroidJni.rs 第 307 行
          # 漏了 .as_ref()：panic_payload_message 期望 &(dyn Any + Send)，
          # 而 catch_unwind 返回的是 Box<dyn Any + Send>，导致 E0308 编译失败。
          # 同一个文件第 107 行写法是正确的（用了 payload.as_ref()），此处补齐 307 行。
          $path = "apps/flutter/native/operit-flutter-bridge/src/AndroidJni.rs"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "未找到 $path，请确认仓库结构未变"
          }
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'panic_payload_message(payload)}).to_string(),'
          $new = 'panic_payload_message(payload.as_ref())}).to_string(),'
          if ($text -like "*$old*") {
            $text = $text.Replace($old, $new)
            Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8
            Write-Host "已修补：panic_payload_message(payload) -> panic_payload_message(payload.as_ref())"
          } elseif ($text -like "*$new*") {
            Write-Host "已包含修补后的写法，跳过"
          } else {
            Write-Host "警告：未匹配到目标代码，可能上游已自行修复或代码有变动"
          }
          # 校验
          $after = Get-Content -LiteralPath $path -Raw
          if ($after -like "*panic_payload_message(payload)}).to_string()*") {
            throw "修补未生效，仍存在缺 .as_ref() 的调用"
          }
          Select-String -Path $path -Pattern "panic_payload_message" | ForEach-Object {
            Write-Host ("   L{0}: {1}" -f $_.LineNumber, $_.Line.Trim())
          }

      - name: Generate Android signing material (self-signed, no secrets required)
        shell: pwsh
        run: |
          $secretsDir = "tools/release/secrets"
          New-Item -ItemType Directory -Force -Path $secretsDir | Out-Null
          $keystore = Join-Path $secretsDir "operit2-release.keystore"
          if (Test-Path -LiteralPath $keystore) { Remove-Item -LiteralPath $keystore -Force }
          keytool -genkeypair -v `
            -keystore $keystore `
            -alias operit2 `
            -keyalg RSA -keysize 2048 -validity 10950 `
            -storepass operit2 -keypass operit2 `
            -dname "CN=Operit2, OU=Mobile, O=Operit2, L=Unknown, ST=Unknown, C=CN"
          if (-not (Test-Path -LiteralPath $keystore)) {
            throw "Failed to generate keystore at $keystore"
          }
          @"
          RELEASE_STORE_FILE=operit2-release.keystore
          RELEASE_STORE_PASSWORD=operit2
          RELEASE_KEY_ALIAS=operit2
          RELEASE_KEY_PASSWORD=operit2
          "@ | Set-Content -Path (Join-Path $secretsDir "android-signing.properties") -Encoding utf8

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products app --github-runner

      - name: Build and package Android app
        id: build_app
        shell: pwsh
        run: |
          $log = "build-android.log"
          $version = (Select-String -Path apps/flutter/app/pubspec.yaml -Pattern '^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$').Matches
          if ($version.Count -ne 1) {
            throw "apps/flutter/app/pubspec.yaml must contain exactly one release version line"
          }
          python tools/build_scripts/build_flutter_android.py --build-name $version[0].Groups[1].Value --build-number $version[0].Groups[2].Value --enforce-lockfile *> $log
          $code = $LASTEXITCODE
          Write-Host "----- 构建日志行数 -----"
          if (Test-Path -LiteralPath $log) {
            $lines = @(Get-Content -LiteralPath $log)
            Write-Host "build log: $($lines.Count) lines,  $((Get-Item $log).Length) bytes"
            # 只截末尾 200 行会丢掉 Gradle/V8 任务细节，排查时看不到
            # prepareOperitAndroidV8 是否复用缓存。这里改为输出全部
            # 含关键标记的行，便于事后核对。
            Write-Host "----- V8 / NDK 关键行 -----"
            $lines | Select-String -Pattern 'prepareOperitAndroidV8|Using verified V8 cache|first build takes time|V8 configuration mismatch|gn gen|BUILDCONFIG\.gn|RUSTY_V8_ARCHIVE' |
              Select-Object -First 60 | ForEach-Object { Write-Host "  $_" }
            Write-Host "----- 构建日志末尾 120 行 -----"
            $lines | Select-Object -Last 120
          }
          Write-Host "----- 结束 (exit=$code) -----"
          if ($code -ne 0) { exit $code }

      - name: Verify APK produced
        shell: pwsh
        run: |
          # 上游产出的文件名带完整版本号（含 prerelease），例如
          # operit2-app-android-arm64-v8a-2.0.0-preview.30.apk。
          # 之前 workflow 里写死成不带版本号的名字，导致 upload-artifact
          # 只匹配到 keystore（2836 字节）却因另一项存在而没触发
          # if-no-files-found: error，APK 静默丢失。这里显式校验。
          $apks = @(Get-ChildItem -LiteralPath "tools/release/dist" -Filter "operit2-app-android-arm64-v8a-*.apk" -File -ErrorAction SilentlyContinue)
          if ($apks.Count -ne 1) {
            throw "expected exactly one Android APK under tools/release/dist, found $($apks.Count)"
          }
          $apk = $apks[0]
          $mb = [math]::Round($apk.Length / 1MB, 1)
          Write-Host "APK: $($apk.Name)  $mb MB"
          if ($apk.Length -lt 50MB) {
            throw "APK looks too small ($mb MB); expected a full release build"
          }

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: operit2-android-${{ github.sha }}
          path: |
            tools/release/dist/operit2-app-android-arm64-v8a-*.apk
            tools/release/secrets/operit2-release.keystore
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-run${{ github.run_number }}
          path: build-android.log
          if-no-files-found: warn
          retention-days: 30
